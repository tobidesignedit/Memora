<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memora Capture</title>
    <style>
      :root {
        --bg: #fafafa;
        --surface: #ffffff;
        --soft: #f4f4f6;
        --ink: #111318;
        --secondary: #525866;
        --muted: #868c98;
        --border: #e8e8ec;
        --border-strong: #d4d6de;
        --accent: #4f46e5;
        --accent-hover: #4338ca;
        --green: #059669;
        --green-soft: rgba(5, 150, 105, 0.1);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0c0f;
          --surface: #14161b;
          --soft: #1c1f26;
          --ink: #f4f5f7;
          --secondary: #a1a7b5;
          --muted: #6e7485;
          --border: #23262f;
          --border-strong: #323644;
          --accent: #6366f1;
          --accent-hover: #818cf8;
          --green: #10b981;
          --green-soft: rgba(16, 185, 129, 0.14);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 360px;
        background: var(--bg);
        color: var(--ink);
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-feature-settings: "calt", "kern", "liga", "ss03";
        padding: 18px;
        -webkit-font-smoothing: antialiased;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 700;
        font-size: 18px;
        letter-spacing: -0.03em;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--green-soft);
        color: var(--green);
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
      }
      label {
        display: block;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--secondary);
        margin: 10px 0 5px;
      }
      input, textarea {
        width: 100%;
        padding: 9px 12px;
        border-radius: 10px;
        border: 1px solid var(--border-strong);
        background: var(--surface);
        color: var(--ink);
        font-size: 13px;
        font-family: inherit;
        outline: none;
        transition: border-color 140ms ease, box-shadow 140ms ease;
      }
      input:focus, textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.14);
      }
      textarea { resize: none; line-height: 1.5; }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }
      button {
        flex: 1;
        border: none;
        border-radius: 999px;
        padding: 9px 14px;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 120ms ease, background-color 140ms ease;
      }
      button:active { transform: scale(0.97); }
      .primary { background: var(--accent); color: #ffffff; }
      .primary:hover { background: var(--accent-hover); }
      .secondary {
        background: var(--surface);
        color: var(--ink);
        border: 1px solid var(--border-strong);
      }
      .secondary:hover { background: var(--soft); }
      .status {
        margin-top: 10px;
        font-size: 11px;
        color: var(--muted);
      }
      .recent {
        margin-top: 14px;
        border-top: 1px solid var(--border);
        padding-top: 12px;
      }
      .recent h3 {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 600;
        color: var(--muted);
      }
      .recent-item {
        font-size: 12px;
        padding: 8px 10px;
        border-radius: 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        margin-bottom: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <svg viewBox="0 0 32 32" width="24" height="24" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#111318" />
          <circle cx="11.5" cy="12.5" r="3.6" fill="#6366F1" />
          <circle cx="21" cy="11.5" r="2.3" fill="#10B981" />
          <circle cx="17.5" cy="21.5" r="2.7" fill="#FFFFFF" />
          <path d="M11.5 12.5L21 11.5M11.5 12.5L17.5 21.5M21 11.5L17.5 21.5" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.25" stroke-linecap="round" />
        </svg>
        <span>Memora</span>
      </div>
      <span class="pill"><span class="dot"></span>Private Vault</span>
    </header>

    <label for="page-url">Webpage URL</label>
    <input id="page-url" type="url" placeholder="https://..." />

    <label for="page-note">Title, Highlight, or Margin Note</label>
    <textarea id="page-note" rows="4" placeholder="Captured webpage excerpt or thought…"></textarea>

    <div class="actions">
      <button id="save-offline" class="secondary" type="button">Queue Offline</button>
      <button id="save-open" class="primary" type="button">Save to Vault</button>
    </div>

    <div id="status" class="status">Shortcut: Alt+M · Right-click any selection to capture.</div>

    <div id="recent-wrap" class="recent" style="display: none">
      <h3>Recent Captures</h3>
      <div id="recent-list"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
